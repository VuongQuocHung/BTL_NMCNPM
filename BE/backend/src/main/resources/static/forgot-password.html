<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="forgot-password">
  <main class="auth-page">
    <section class="panel auth-box">
      <a class="logo" href="index.html">LaptopStore</a>
      <form id="forgotForm" class="form">
        <h1>Quên mật khẩu</h1>
        <p id="forgotNotice" class="notice"></p>
        <label>Email
          <input name="email" type="email" required>
        </label>
        <button class="button primary full" type="submit">Gửi email đặt lại</button>
      </form>
      <hr>
      <form id="resetForm" class="form">
        <h2>Đặt lại bằng token</h2>
        <label>Token
          <input name="token" required>
        </label>
        <label>Mật khẩu mới
          <input name="newPassword" type="password" required>
        </label>
        <button class="button full" type="submit">Đặt lại mật khẩu</button>
      </form>
      <div class="auth-links"><a href="login.html">Quay lại đăng nhập</a></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
